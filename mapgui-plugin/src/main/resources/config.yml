# Which set of settings this file was written for. MapGUI keeps it up to date and moves anything it
# renames, so an old file keeps working - there is nothing here to edit by hand.

config-version: 1

colors:
  # Which formula picks the nearest map colour to a colour you asked for.
  #
  #   vanilla     What Minecraft itself uses, and what every map you already have looks like.
  #   perceptual  Nearest in Oklab, a space built so that equal distances look equally different.
  #
  # Two roundings rather than an upgrade - neither measures better than the other, they just disagree about some
  # colours. docs/images/colour-matching.png draws both over the same ramps, which is the way to pick.
  #
  # Read once at startup, so changing it needs a restart.
  matching: vanilla

prompts:
  # How text input is asked for. "dialog" is a native Minecraft dialog and needs no
  # inventory tricks; "anvil" renames an item.
  # Other plugins can register their own and be named here.
  default: dialog

hand:
  # How a GUI in a player's hand is carried, unless the screen or the plugin opening it says otherwise.
  # This is the default for every GUI on the server, so a screen that needs a particular mode should set
  # it itself rather than relying on this.
  #
  #   popup    A map in every hotbar slot, offhand reported empty so it draws large and two-handed. Cannot be
  #            moved, dropped or taken, because it is not in anybody's inventory. Always has the player's
  #            mouse, and is the only mode where the plain scroll wheel is the menu's scroll - every slot
  #            shows the same map, so nothing is lost by taking it. Q closes. MapGUI's original, and the
  #            right answer for a menu.
  #   item     A real item. Picked up, dropped, handed over, left in a chest - and whoever holds it gets
  #            THEIR OWN screen, built fresh for them, so a phone found in a chest shows its finder their
  #            phone. Needs the GUI registered by name; see MapGui#item.
  #   pinned   A fake map in one hotbar slot, which never leaves the player's own inventory. Reads like an
  #            item and cannot be lost like one.
  #   offhand  A fake map in the offhand, with the main hand left entirely to the player. Cannot be held in
  #            the main hand at all, so `focus` is the only way to reach it.
  carry: popup

  # Which hotbar slot, 0 to 8, a pinned map sits in. Ignored by the other modes.
  slot: 8

  # Whether the player may move a pinned map to another slot of their own - never out of their inventory.
  # Done with the number keys over its slot while the inventory is open, which is the one move gesture that
  # works on an item the server does not really have.
  movable: false

  # Whether the map may be carried in the offhand, for `item` and `pinned`. Always true for `offhand`,
  # always false for `popup`, which claims both hands to draw itself big.
  offhand: false

  # What gives a map in the OFFHAND the player's mouse - a cursor, head movement, and their clicks
  # swallowed instead of reaching the world. A map in the main hand always has it, and a popup always has
  # it, so this is only ever about the offhand.
  #
  #   main-hand    Only the main hand. In the offhand it is a picture. Nothing to explain to a player: to
  #                use the map, hold it.
  #   swap-hands   The swap-hands key - F unless they have rebound it - toggles it, moving nothing. The
  #                natural one for `offhand`, where that key has nothing else to do, and the default there.
  #   right-click  Right-clicking into empty air toggles it. Pair with a screen that activates on the left
  #                button, since the right one is then spoken for.
  #   sneak        Held while sneak is held, let go when it is released.
  #   always       Both hands. Which means an offhand map eats every click, so the player cannot mine or
  #                place anything until the screen closes.
  #   never        Neither hand. A display and nothing more.
  focus: main-hand

animations:
  # Ease scrolling and color changes instead of snapping.
  enabled: true

  # Ceiling on frames driven by animation. 20 is the most a map can do, since updates go out once
  # per tick. Clicks and hover always repaint at once, so lowering this costs responsiveness
  # nothing - it only makes animation coarser.
  fps: 20

  # The same for effects that loop forever - scrolling long text, an animated gradient. These are
  # where the bandwidth goes, because they never settle, so they get their own lower ceiling.
  # A full-canvas effect is 16 KB per frame per player: 320 KB/s at 20, 160 KB/s at 10.
  loop-fps: 10

cursor:
  # Head rotation is the mouse. This is the pitch range the vertical axis is mapped onto.
  min-pitch: 45.0
  max-pitch: 90.0

  # Push the player's head back inside that range, so they always have room to move both ways and
  # cannot look away from the map. Off leaves their head alone and just stops the cursor at the edge,
  # which means looking further only wastes movement - but nothing touches their view.
  #
  # A screen that turns its cursor off never restricts the head either way - there is nothing to aim at,
  # and neither does a map in the offhand: that one is glanced at while the player looks at the world.
  #
  # The cursor appears in the middle of the map every time, and does not move while it is hidden. On, your
  # head is turned to the middle of the range with it. Off, it starts nearer an edge when you are already
  # looking far up or down, since there would be no head movement left to bring it back the other way.
  clamp-pitch: true

terrain:
  # Minimum ticks between terrain redraws, for screens that draw the world. Each redraw reads
  # one block column per pixel, so don't set this too low.
  min-ticks-between-refresh: 4

commands:
  # /mapgui and everything under it. Off means it is never registered at all - not registered and refused, so
  # nothing of MapGUI's shows up in a tab completion or a help listing.
  #
  # For a server whose plugin ships its own commands over the API and does not want two ways to ask the same
  # question. Everything /mapgui does is reachable from code: MapGui.get().camera().stats() is the same reading
  # /mapgui camera performance prints, and the GUI catalog, the walls and the sessions are all on MapGui too.
  #
  # Takes effect on restart. A command tree is built once, when the server starts.
  enabled: true

  # Hide the branches this server has nothing to administer. MapGUI is a library, so what it can administer is
  # whatever the plugins on top of it registered - a server that installed it for one camera has no GUIs to open
  # and no walls to place, and two branches of commands about features that will never run teach an admin not to
  # read the tree.
  #
  # Worked out rather than configured: /mapgui hand appears when a plugin registers a GUI, /mapgui wall when
  # there is content to place or a wall already up, /mapgui camera when something asks the camera for anything
  # or you have installed textures for it. Nothing is removed, only unlisted, and it appears the moment it has
  # something in it.
  #
  # Off shows the whole tree whatever this server does with it.
  hide-unused: true

camera:
  # Vertical field of view for a capture, in degrees. 70 is the client's default, and the server has no way
  # to know what any given player has set theirs to, so this is as close as it gets.
  fov: 70

  # How far a capture traces, in blocks. Capped by the server's view distance whatever this says: beyond
  # that the chunks are not loaded, so there is nothing to trace and the ray draws sky.
  max-distance: 96

  # How a capture is matched to the map palette - the same modes as media.dither.
  #
  # A capture is a photograph, so an error diffusion mode is worth trying: FLOYD_STEINBERG first. NONE is the
  # default because it is what captures have always looked like, and because a live viewfinder pays for
  # dithering in bandwidth the same way a video wall does - a dither pattern compresses poorly, and a live
  # capture is sent as often as a video. For a still that is photographed once, it costs nothing.
  dither: NONE

  # How far off black an unlit block is drawn, from 0 to 0.5.
  #
  # 0 is exactly what your client does with its brightness slider all the way up, and it is darker than people
  # expect: a wholly unlit block comes out at 4 of 255 on stone, so a dark room is a black rectangle. That is
  # faithful and often not what you want, because a map is not a screen - it has 143 colours to say "dark" with,
  # and a viewer whose eye is adapted to the rest of their monitor rather than to a cave.
  #
  # 0.3 lands that same block at 40 of 255 - dark, but you can see it is a room. The lift is weighted onto the
  # dark end, so a lit room barely moves: light 11 of 15 goes from 0.872 to 0.885.
  #
  # That is about as far up as it goes while dark still reads as dark. Turn it down for a faithful cave; above
  # here a dark room flattens toward grey rather than getting clearer, and the far end is a flat grey picture.
  shadow-lift: 0.3

  # How far entities are drawn in a capture, in blocks. Every one in range is a model to assemble, so this is
  # what the entity half of a capture costs - and past about this far a mob is a couple of pixels on a map.
  #
  # Capped by what your server actually sends: spigot.yml's entity-tracking-range decides which entities a
  # client is told about at all, so MapGUI takes the nearer of the two (less a tenth, since one exactly at the
  # edge may or may not have been sent). Raising this past your tracking range therefore does nothing, and a
  # server that tracks closer than this pulls captures in with it - which is what stops a photograph holding a
  # mob that is not on the photographer's own screen.
  max-entity-distance: 64

  # How far out the gaps in leaves close up, so a forest photographs as a green mass rather than a haze of
  # twigs with daylight behind it. Untouched, a leaf stays a cutout at any range, so a ray finds a gap, carries
  # on through the whole wood and comes out at the sky.
  #
  # It is a resolution problem rather than a taste one. A leaf texture is 16x16 across a block face, so from
  # some distance out a texel is smaller than a pixel of the capture and a gap no longer has a pixel of its own
  # to be seen through: what the pixel covers is part leaf and part gap. From near-blocks the gaps fill in over
  # the texture's own average color, reaching solid at far-blocks. The client gets to the same place from the
  # other direction, by mipmapping.
  #
  # Where that crossover really falls depends on the size and field of view you shoot at, which is why these
  # are settings. Raise near-blocks if leaves close up too soon on a small map; a big capture with a narrow fov
  # resolves further, so it wants both pushed out.
  leaves:
    # Where the gaps start closing, in blocks. 0 closes them from the lens out, which is what makes a distant
    # canopy solid without a band of haze in front of it. Raise it to see sky through a tree overhead.
    near-blocks: 0

    # Where a canopy is solid. Past this a wood is a surface rather than a thousand leaves with sky between.
    # Equal to near-blocks it is a hard switch at that one distance; past max-distance nothing ever fills.
    far-blocks: 50

  # What may be reused from an earlier capture, and for how long. You do not need any of this - every key
  # below already defaults to what the camera uses. It is here because these are the only settings that trade
  # truth for speed, and that is a server owner's call.
  #
  # They are timers because there is nothing to invalidate on: block events miss pistons, fluid, growth and
  # every other plugin, a chunk carries light as well as blocks, and nothing reports that a mob drew its sword.
  # So a capture can show something as it was up to this long ago.
  #
  # Each ramps with distance, since staleness is only worth what it hides: what is at your feet is most of the
  # picture, what is at the horizon is a few pixels. Longer is faster and less true; zeroes turn reuse off.
  reuse:
    # Copied chunk columns, in chunks out from the one the camera is in. The biggest win of the three, since
    # copying the world is the half of a capture that lands on the main thread.
    chunks:
      near-ms: 500
      far-ms: 2000
      near-chunks: 2
      far-chunks: 12

      # What a STILL photograph may reuse, which is a different question: it is kept and looked at, and no
      # frame follows to correct it. Worth turning on for a burst of shots; 1000 is sensible if you want it.
      stills-for-ms: 0

    # Chests, signs, banners, shelves and pots, in blocks. They do not move and they only change when somebody
    # edits them, so this is nearly free.
    tile-entities:
      near-ms: 500
      far-ms: 2000
      near-blocks: 16
      far-blocks: 64

    # What an entity LOOKS LIKE - its model, what it wears, its variant, its skin. Never where it stands: that
    # is read fresh every capture whatever you put here, so a reused mob is always in the right place. What can
    # lag is the sword it just drew or a player's crouch. Tighter up close, since that is what you are looking at.
    entities:
      near-ms: 100
      far-ms: 2000
      near-blocks: 16
      far-blocks: 64

  # Caps on what one capture may draw, so a mob farm or a storage room in shot cannot fill a frame. Both keep
  # the nearest, so what gets dropped is whatever was furthest away.
  limits:
    max-entities: 48

    # Counted in drawn parts rather than in blocks, since some draw more than one: a banner is its pole and its
    # cloth, a sign is a side of text each way. So this is a few hundred blocks rather than exactly 512.
    max-tile-entities: 512

    # How far chests and signs are gathered from, in blocks. Entities have their own range above, under
    # max-entity-distance, since that one is capped by what your server actually tracks.
    tile-entity-distance: 64

  # What a LIVE view costs you. A still photograph is not this: it happens once, somebody pressed a button and
  # is waiting for it. A viewfinder wants every frame it can get, forever, and how many that should be depends
  # on how many other people have one open - which only the server can see, so the server decides.
  #
  # Everything between these two numbers is spent. Views take as many frames as the budget affords and stop at
  # the ceiling, so one person alone does not get twenty times the frames for being alone, and the tenth person
  # to open one slows everybody down instead of costing you ten times as much.
  #
  # With the defaults below and a frame that costs a millisecond of main-thread time, everybody gets the full
  # 10 fps up to six viewers at once; the seventh brings them all to 8.6, and twelve get 5 each. What a frame
  # really costs is measured per viewer rather than assumed, so a small viewfinder pointed at a wall earns a
  # higher rate than a wide one over a valley.
  live:
    # Main-thread time a tick may spend copying the world for live views. This is the only kind of time a
    # capture can take from the server - the trace runs on its own threads and cannot cost you a tick - so it
    # is the number to turn down if the camera is what is hurting. A tick is 50ms, so 3.0 is 6% of one.
    #
    # 0 means no budget: views take whatever the ceiling allows, however many of them there are.
    max-ms-per-tick: 3.0

    # The most frames a second any one view may take, however much budget is going spare. Past about 10 a
    # viewfinder on a map stops looking better and only costs more - a map holds 128 pixels and the palette
    # is 61 colours, so the frames are not what is limiting how it looks.
    #
    # 0 means no ceiling: one lonely viewer would take the entire budget.
    max-fps: 10

  assets:
    # The camera draws blocks and mobs with Minecraft's real textures, which are not ours to ship. With this
    # on, MapGUI downloads the official client jar from Mojang the first time something takes a capture,
    # checks it against Mojang's own SHA-1, keeps the textures and deletes the rest. Once, per version, into
    # plugins/MapGUI/cache/camera/.
    #
    # Nothing is downloaded at startup: most installs of MapGUI never take a capture, and 39 MB of outbound
    # traffic for a feature nobody has called is not something a plugin should do unasked.
    #
    # Off means MapGUI never makes an outbound connection, and the camera is disabled unless you supply the
    # files yourself below.
    download: true

    # Files in plugins/MapGUI/assets/ to draw with - a client jar, a resource pack zip, or both. Layered
    # top-down the way the client stacks packs, so your own pack wins where it has a texture and vanilla
    # fills in the rest.
    #
    # Left empty, every zip and jar in that directory is used, sorted by name. So a server that ships a
    # resource pack only has to drop it in there for captures to match what its players see. Name files here
    # when you want a particular order, or want some of them ignored.
    #
    # Anything here is read and never written: a file you pinned deliberately is never replaced.
    packs: []

    # Draw with the resource packs this server hands its own players, so a capture matches what they see
    # without anybody installing the same pack twice.
    #
    # This is the pack named in server.properties. It is fetched once, kept in
    # plugins/MapGUI/cache/camera/packs/ under its own SHA-1, and layered UNDER anything in the packs list
    # above, since that list is a decision and this is a convenience.
    #
    # A pack a PLUGIN pushes cannot be found this way - nothing reports its address - so a plugin serving its
    # own pack calls Camera#useResourcePack instead. That works whatever this is set to.
    #
    # Off stops the looking. A pack already fetched stays in use, since having it is not the same as reaching
    # out for it - delete it from cache/camera/packs/ if you want it gone.
    #
    # Two things to know. It is an outbound connection to whatever address the pack is served from, so turn it
    # off alongside download if the point is that this plugin never reaches out. And it is server-wide: if
    # different players get different packs, or one declines theirs, everybody's captures still use whatever
    # was found.
    follow-server-packs: true

    # Load textures whose version does not match the server's. Off, because wrong textures are worse than
    # none - a capture that quietly draws the old grass is a confusing bug report. On, blocks added or
    # renamed since then render as the missing-texture checkerboard.
    #
    # For snapshot servers and forks, where the matching assets may not exist to download at all.
    allow-version-mismatch: false

walls:
  # Walls placed with /mapgui wall place. Every map in a wall is 16 KB per frame, so this is the
  # setting that decides what a wall costs: a 2x2 at 10 is 640 KB/s per viewer, and a 6x6 is nine
  # times that. Only players in range are sent anything, so an empty room is free.
  fps: 10

  # How close a player has to be to be sent a wall, measured to its middle. Keep it inside your
  # view-distance - beyond that the client has unloaded the chunk and thrown the frames away.
  view-distance: 48

  # Send a short looping animation once instead of streaming it, and play it by pointing each client at
  # the frames it already has. A 2x2 wall at 10 fps costs about 640 KB/s streamed and under 1 KB/s this way.
  #
  # Only for animations of 32 frames or fewer - longer ones stream, since sampling them down to 32 would
  # change what they look like. The cost is memory and one burst: every frame is a whole copy of the wall,
  # held here and in each viewer's client, and all of it is sent the moment somebody walks into range.
  # A 12 frame 3x3 wall is about 1.7 MB per client, which pays for itself in a couple of seconds.
  prerender: true

  # Longest edge videos are decoded at. Bigger walls upscale rather than decoding again, since a
  # resize would otherwise mean re-reading the file for every step. 256 is 1:1 for a 2x2 wall.
  #
  # This is the setting that decides memory, not the file size: a frame is one byte per pixel once
  # decoded, so at 256 it is 64 KB whatever the GIF compressed to on disk. A 20 second clip at 10 fps
  # is 200 frames, so roughly 13 MB of heap. Frames are let go once no wall shows them, so what you
  # pay for is what is up - not everything you have ever tried. Takes effect on restart.
  video-size: 256

media:
  # Play mp4 and live streams as well as GIFs, using FFmpeg - and read the image formats ImageIO cannot,
  # which is WebP, AVIF and HEIC.
  #
  # Off, and turning it on downloads about 80 MB of native libraries on the next start - only the build for
  # this operating system and processor, once, cached by the server alongside every other plugin library.
  # MapGUI does not ship it: most servers never play a video, and a full FFmpeg build is not something to
  # hand out on everybody's behalf.
  #
  # With this on, any file in plugins/MapGUI/videos that FFmpeg can open - .mp4, .mkv, .webm, .mov and so
  # on - can be placed with /mapgui wall place, the same as a GIF. The difference is that a GIF is decoded
  # into memory once and a video is decoded as it plays, which is what makes a two hour film possible.
  #
  # PNG, JPEG, BMP and GIF never need this: ImageIO reads them and always has.
  ffmpeg: false

  # Turn a page url - a YouTube or Twitch link - into a media url this server can play.
  #
  # Off, and separate from ffmpeg above because it is a different kind of decision: turning it on fetches
  # yt-dlp and a small JavaScript runtime into plugins/MapGUI/tools/ and RUNS them, and keeps yt-dlp
  # updated because YouTube rejects old releases outright. Everything lives in that folder and leaves with
  # the plugin; nothing on this machine is used or installed to.
  #
  # Needed only for page urls. Files, direct media urls and rtsp/rtmp/hls all work without it.
  #
  # YouTube and Twitch both restrict access from outside their own players. Whether that is acceptable is
  # the operator's call, which is why this is off and says so here.
  resolve-page-urls: false

  # How anything decoded here is matched to the map palette: a video, a still, a downloaded clip.
  #
  #   NONE             Nearest colour. No pattern, but a gradient or a photograph bands into stripes.
  #   ORDERED          A 4x4 pattern. What a gradient has always used.
  #   ORDERED_FINE     An 8x8 pattern, finer across large smooth areas.
  #   BLUE_NOISE       No visible grid, and the worst of the lot to compress. For stills, not for video.
  #   FLOYD_STEINBERG  Error diffusion, the most faithful. The one to try first on anything photographic.
  #   ATKINSON         Error diffusion that throws a quarter of the error away. Reach for it if the above worms.
  #   SIERRA_LITE      Error diffusion, cheaper and coarser.
  #
  # Applied once per frame as it is decoded, not once per viewer per repaint, so the cost is paid once however
  # many walls show it. It does cost bandwidth: a dither pattern is poor material for the map packet's own
  # compression, and video already sends the most bytes of anything here - see docs/performance.md.
  #
  # This is the default. A plugin calling MediaService may name a mode per stream and override it.
  dither: NONE

  # Whether a pixel in a video holds still through noise rather than flickering between two palette entries
  # that look the same.
  #
  # Real footage wobbles a little between frames, and in full colour that is invisible. Rounded to the map
  # palette it is not: a pixel sitting between two entries flips back and forth every frame. That shimmers, and
  # because MapGUI only sends the part of a map that changed, it also makes the changed part the whole map every
  # frame - on a busy wall the difference is most of the bandwidth.
  #
  # A held pixel is never more than a hair further from its true colour than it would have been, so this is not
  # a quality trade. Turn it off if a very slow fade looks like it is stepping.
  steady: true

  # Shortcuts for /mapgui wall place <name>. Anything FFmpeg can open: rtmp, rtsp, hls, a plain http url,
  # and with resolve-page-urls on, a page url too.
  #
  # NOT an allowlist. A plugin using MapGUI's MediaService may play any url it likes - it could open the
  # socket itself without asking us - so what a name buys is not typing a url into a command. A /stream
  # <url> command that players can run is that plugin's decision to gate by permission.
  #
  # One connection and one decode per name however many walls show it. Needs ffmpeg above.
  streams: {}
    # lobby-cam: rtsp://10.0.0.5:554/stream1
    # bbb: https://example.com/big_buck_bunny.mp4
    # big-screen: https://www.youtube.com/watch?v=aqz-KE-bpKQ

  # What MediaService#download may put in plugins/MapGUI/cache/media, which is where a clip fetched once and
  # played many times lives. A download refuses rather than truncating, and says which cap it hit.
  #
  # Live means stream; a clip you will show more than once means download - once it is local there is no
  # expiry, no re-resolution and no dependency on the source being up when somebody walks past.
  download:
    # Biggest single file, in MB.
    max-file-mb: 256

    # Everything in the cache together, in MB. The least recently used files go first when a new one needs
    # the room.
    max-total-mb: 2048

    # The most frames one clip may be held as. A download is sampled down to walls.fps, since a wall cannot
    # show more, so 1200 is two minutes at 10 fps - about 78 MB of heap at walls.video-size 256. A longer
    # clip is refused rather than quietly cut short: stream it instead, which holds one frame at a time.
    max-frames: 1200
