# The JavaScript runtime yt-dlp needs, pinned to a release and a SHA-256 per platform. Toolchain fetches one
# on demand into plugins/MapGUI/tools/, and only on a server that turned media.resolve-page-urls on.
#
# The hash covers the asset exactly as it comes off the wire. Bumping the release means re-hashing every asset,
# from the release page's own downloads:
#
#   curl -sL https://github.com/quickjs-ng/quickjs/releases/download/<tag>/<asset> | sha256sum
#
# Hash first, then edit this file, never the other way round. A wrong hash is not a silent problem: the fetch
# refuses to move the file into place and says what it expected and what it got.
qjs.release=v0.16.1
qjs-windows-x86_64.exe=55a1b69cd4fdb6b0d3f8fdd910d0e89519f5330e408462084140c7b3b964fdae
qjs-windows-x86.exe=454a3b1f6712ce73f1bd3a00b341a000f36f2af2570b9edc7b70ae502a8864b8
qjs-linux-x86_64=aae0d428c88bdd30fb490f54e616ebd4009ec279cc2a16ecebf0c3e17f7e76e7
qjs-linux-aarch64=c1635453aa60a78ebc7f05b2b559e0e9e9eb7d55b4dfc4a6e71a07d9d10b8a89
qjs-linux-armv7=f615370e5a010c62943eb9708fe5ba2611d8b99a314807b6b2468b55555da367
qjs-linux-riscv64=1d213c4a4816511735ab6a93fc123ed0d6b7f98e12860370d7ce127ad7220874
qjs-linux-x86=e62b33cb65487e0204bd2fda5582a10d2acedb09361fab03a3a86feb7fcbe854
qjs-darwin-arm64=9a24e7435036906c098d539daf47bcc8e7e8ad2f3aa084a0bce9313c6c3527e0
qjs-darwin-x86_64=5982a1ebb20e1a9bf6162bafd29d445823616084cfeddee8881f8d69d6e0fd74

# yt-dlp is deliberately absent. It is fetched at whatever release is current at the time and checked against
# the SHA2-256SUMS published in that release, because YouTube breaks old yt-dlp within weeks and a version
# pinned into a plugin jar is a 403 with a delay fuse. See Toolchain.
#
# FFmpeg is absent for the opposite reason: it is not a binary here at all. MapGUI decodes in-process with
# JavaCV, fetched by VideoLibraryLoader through Paper's library loader and pinned in VideoNatives, where the
# bindings and the natives have to match.
