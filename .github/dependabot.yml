version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # One pull request for the routine bumps rather than one each. A major stays on its own, since that is the
    # kind worth reading.
    groups:
      # JavaCV and FFmpeg are one dependency in two artifacts: the FFmpeg build is the one that JavaCV release
      # ships, and VideoNatives names both so the loader can fetch them. Offered separately they arrive as two
      # pull requests either of which breaks the pair on its own, so they are grouped whatever the update is.
      # First, since a dependency joins the first group that matches it.
      ffmpeg:
        patterns: ["org.bytedeco:*"]
      gradle:
        patterns: ["*"]
        update-types: [minor, patch]
    # paperweight publishes a 2.0.0-SNAPSHOT that sorts above every beta, so this is offered as an upgrade every
    # month. It is not one: a snapshot moves under a build that has not changed, which is the opposite of what
    # pinning a version is for.
    ignore:
      - dependency-name: io.papermc.paperweight.userdev
        versions: ["2.0.0-SNAPSHOT"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
