name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      # Caches the Mojang-mapped server that paperweight builds for mapgui-nms, which is
      # otherwise several minutes of every run.
      - name: Cache paperweight setup
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches/paperweight
            .gradle/caches/paperweight
          key: paperweight-${{ hashFiles('gradle/libs.versions.toml') }}

      - run: ./gradlew build --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: MapGUI
          path: |
            mapgui-plugin/build/libs/MapGUI-*.jar
            examples/*/build/libs/*.jar
          if-no-files-found: error
