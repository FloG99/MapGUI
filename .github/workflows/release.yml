name: Release

# Tag a commit v1.0.0 and this builds it, publishes mapgui-api to Maven Central,
# and attaches the plugin jar to a draft GitHub release. See .github/RELEASING.md for the one-time setup.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Cache paperweight setup
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches/paperweight
            .gradle/caches/paperweight
          key: paperweight-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Read the version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build and test
        run: ./gradlew build -Pversion=$VERSION --stacktrace

      # Signed here rather than in the upload step, because the key has to be present while Gradle
      # configures - that is what decides whether the signing plugin is applied at all.
      - name: Assemble the signed Central bundle
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: ./gradlew centralBundle -Pversion=$VERSION --stacktrace

      - name: Refuse an unsigned bundle
        run: |
          count=$(unzip -l build/central-bundle.zip | grep -c '\.asc$' || true)
          echo "$count signatures in the bundle"
          test "$count" -gt 0 || { echo "::error::No .asc files - is MAVEN_GPG_PRIVATE_KEY set?"; exit 1; }

      # Left as USER_MANAGED on purpose: the release waits in the Portal until you look at it and press
      # publish. Switch to AUTOMATIC once you trust the pipeline.
      - name: Upload to the Central Portal
        env:
          CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          token=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $token" \
            -F bundle=@build/central-bundle.zip \
            "https://central.sonatype.com/api/v1/publisher/upload?name=MapGUI-$VERSION&publishingType=USER_MANAGED"

      # The plugin is all a server needs. The examples are optional, and the two library jars are for anyone
      # who would rather drag a jar in than add a dependency - sources included, for a usable IDE.
      #
      # No javadoc jar. Central requires one and gets one, but here it is four megabytes of html nobody unzips:
      # a build tool attaches it from Central on its own, and everyone else reads it on javadoc.io.
      #
      # Named by version rather than globbed, and unmatched is fatal: the action is happy to publish a release
      # with an asset missing, so a renamed jar would otherwise go out as a release nobody can install.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            mapgui-plugin/build/libs/MapGUI-${{ env.VERSION }}.jar
            examples/bundle/build/libs/MapGUI-examples-${{ env.VERSION }}.jar
            mapgui-api/build/libs/mapgui-api-${{ env.VERSION }}.jar
            mapgui-api/build/libs/mapgui-api-${{ env.VERSION }}-sources.jar
