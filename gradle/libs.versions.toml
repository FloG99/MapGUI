[versions]
java = "25"
minecraft = "26.2"
# The oldest server MapGUI runs on, which is what paper-plugin.yml's api-version has to say. Not the version
# above: that is what this is built and tested against.
minecraftMin = "26.1"
# One dev bundle per NMS module, newest first, each pinned because each module is compiled against that
# version's own server jar and nothing else can be.
paper = "26.2.build.112-stable"
paper261 = "26.1.2.build.74-stable"
junit = "6.1.3"
# FFmpeg playback. compileOnly here and downloaded at runtime by VideoLibraryLoader, so these two must
# stay in step with the constants in VideoNatives. The FFmpeg version is the one that JavaCV release ships.
javacv = "1.5.14"
ffmpeg = "8.1.2-1.5.14"
annotations = "26.1.0"
# Matched to what the oldest supported Paper puts on the runtime classpath, since the server supplies this and
# a method added in a later gson would be a NoSuchMethodError there.
gson = "2.13.2"
paperweight = "2.0.0-beta.21"
runpaper = "3.1.0"
shadow = "9.6.1"

[libraries]
# The oldest supported dev bundle deliberately, not the newest. Everything above the backend modules compiles
# against the floor, so an API added in 26.2 cannot slip in and become a NoSuchMethodError on a 26.1 server -
# which is the one failure no backend module can shield.
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper261" }
# Only for mapgui-camera, which has no Bukkit dependency and so cannot pick this up from paper-api the way
# every other module does. compileOnly there too: the server puts it on the runtime classpath either way.
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
annotations = { module = "org.jetbrains:annotations", version.ref = "annotations" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
javacv = { module = "org.bytedeco:javacv", version.ref = "javacv" }
ffmpeg = { module = "org.bytedeco:ffmpeg", version.ref = "ffmpeg" }

[plugins]
paperweight-userdev = { id = "io.papermc.paperweight.userdev", version.ref = "paperweight" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "runpaper" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
